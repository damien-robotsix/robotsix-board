[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-board"
version = "0.5.7"
description = "Shared kanban-board frontend library: column-per-status board chrome parameterized by a data adapter and render mode."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Damien Robotsix" }]
dependencies = [
    "hypothesis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/damien-robotsix/robotsix-board"
Repository = "https://github.com/damien-robotsix/robotsix-board"
Documentation = "https://damien-robotsix.github.io/robotsix-board/"
Issues = "https://github.com/damien-robotsix/robotsix-board/issues"
Changelog = "https://github.com/damien-robotsix/robotsix-board/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff==0.17.1",
    "pytest",
    "deptry",
    "mypy",
    "pytest-cov",
    "pytest-xdist",
    "bandit",
    "check-jsonschema",
    "detect-secrets",
    "vulture",
    "pre-commit",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    # >=1.0.8: older releases break with pymdown-extensions 12.3 (Highlight.__init__ requires md).
    "mkdocstrings[python]>=1.0.8",
    "pymdown-extensions>=11.0.0",
]

[dependency-groups]
# CI-only tooling: kept out of [project.dependencies] so consumers of
# robotsix-board never resolve it. `uv sync` installs the dev group by default.
dev = [
    "robotsix-modules",
]

[tool.uv.sources]
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules.git", rev = "1c7d01f4ed264524857838fad78b5a3d05d3d774" }  # pragma: allowlist secret


[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
index-strategy = "first-index"
exclude-newer = "3 days"
# certifi 2026.10.19 fixes GHSA-6q48-6c7w-9gw2 / PYSEC-2026-4320 but is still
# inside the exclude-newer window; exempt it so the security fix can be locked.
exclude-newer-package = { certifi = false }

[tool.uv.audit]
malware-check = true

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_board"]

[tool.pytest.ini_options]
addopts = "-n 2 --cov=robotsix_board --cov-branch --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "PT", "N", "ERA", "PTH", "C4", "RUF", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"vulture_whitelist.py" = ["B018"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.deptry]
known_first_party = ["robotsix_board"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP002 = ["mkdocs", "mkdocs-material", "mkdocstrings", "pymdown-extensions", "vulture", "check-jsonschema", "pytest-xdist", "robotsix-modules", "hypothesis"]  # CLI tools used via workflows, not imported
