[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-board"
version = "0.5.2"
description = "Shared kanban-board frontend library: column-per-status board chrome parameterized by a data adapter and render mode."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Damien Robotsix" }]
dependencies = [
    "robotsix-modules @ git+https://github.com/damien-robotsix/robotsix-modules.git@d916d1c14198dd00bb136605224177289c73352c",
    "hypothesis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/damien-robotsix/robotsix-board"
Repository = "https://github.com/damien-robotsix/robotsix-board"
Documentation = "https://damien-robotsix.github.io/robotsix-board/"
Issues = "https://github.com/damien-robotsix/robotsix-board/issues"
Changelog = "https://github.com/damien-robotsix/robotsix-board/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "pytest",
    "deptry",
    "mypy",
    "pytest-cov",
    "pytest-xdist",
    "bandit",
    "check-jsonschema",
    "detect-secrets",
    "vulture",
    "pre-commit",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions>=11.0.0",
]


[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
index-strategy = "first-index"
exclude-newer = "3 days"

[tool.uv.audit]
malware-check = true

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_board"]

[tool.pytest.ini_options]
addopts = "-n auto --cov=robotsix_board --cov-branch --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "PT", "N", "ERA", "PTH", "C4", "RUF", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"vulture_whitelist.py" = ["B018"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.deptry]
known_first_party = ["robotsix_board"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP002 = ["mkdocs", "mkdocs-material", "mkdocstrings", "pymdown-extensions", "vulture", "check-jsonschema", "pytest-xdist", "robotsix-modules", "hypothesis"]  # CLI tools used via workflows, not imported
