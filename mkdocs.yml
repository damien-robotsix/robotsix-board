site_name: robotsix-board
site_description: Shared kanban-board frontend library — integration docs
repo_url: https://github.com/damien-robotsix/robotsix-board
theme:
  name: material
markdown_extensions:
  - pymdownx.snippets:
      base_path: [.]
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
nav:
  - Home: index.md
  - Integrating: integrating.md
  - API Reference: api.md
  - JS Architecture: architecture.md
  - CSS Theming: theming.md
  - Changelog: changelog.md
  - Contributing: contributing.md
