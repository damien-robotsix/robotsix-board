site_name: robotsix-board
site_description: Shared kanban-board frontend library — integration docs
repo_url: https://github.com/damien-robotsix/robotsix-board
theme:
  name: material
markdown_extensions:
  - pymdownx.snippets:
      base_path: [.]
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
nav:
  - Home: robotsix_board/index.md
  - Integrating: robotsix_board/integrating.md
  - API Reference: robotsix_board/api.md
  - JS Architecture: robotsix_board/architecture.md
  - CSS Theming: robotsix_board/theming.md
  - Changelog: robotsix_board/changelog.md
  - Contributing: robotsix_board/contributing.md
