name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  actions: read  # required for CodeQL workflow dispatch
  contents: read

jobs:
  codeql:
    permissions:
      actions: read  # job-level permissions REPLACE the top-level set for reusable workflows
      contents: read  # the called workflow's checkout needs this; omitting it = startup_failure with no logs
      security-events: write  # required for SARIF uploads
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@7314c9b6c2b536ca81023e8841f272b72733262e  # main
    with:
      languages: python,javascript
