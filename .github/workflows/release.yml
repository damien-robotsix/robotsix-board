name: Release

on:
  release:
    types: [published]

# Least-privilege default; the publish job below grants the extra OIDC scope it needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Verify tag, pyproject version, and CHANGELOG are consistent
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag '$TAG' does not match pyproject version '$version'"; exit 1
          fi
          if ! grep -qE "^## \[?$version\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section (did you forget to promote [Unreleased]?)"; exit 1
          fi

  publish:
    needs: verify
    permissions:
      id-token: write  # OIDC trusted publishing to PyPI
    # Cross-repo reusable workflow: robotsix-board shares its release logic with
    # the robotsix-mill monorepo so that PyPI trusted publishing, attestation,
    # and provenance are maintained in a single place.  Dependabot is configured
    # for github-actions and will propose SHA bumps as the upstream evolves.
    # TODO: update SHA periodically (Dependabot auto-proposes bumps weekly).
    uses: damien-robotsix/robotsix-mill/.github/workflows/python-release.yml@bb5396a62ef96f5808f6e74a4c0035e9cfe4d65a
    secrets: inherit
