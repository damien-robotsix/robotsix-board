name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # TODO: update SHA periodically (Dependabot auto-proposes bumps weekly).
    uses: damien-robotsix/robotsix-mill/.github/workflows/python-docs.yml@bb5396a62ef96f5808f6e74a4c0035e9cfe4d65a
    with:
      docs-install-args: "--extra docs"
    secrets: inherit
