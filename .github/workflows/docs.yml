name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      pages: write  # required for GitHub Pages deployment
      id-token: write  # required for OIDC-based Pages auth
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@4c25a782556a8811d7aeed635b91fd9f790df203
    with:
      docs-install-args: "--extra docs"
