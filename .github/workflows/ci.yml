name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: damien-robotsix/robotsix-mill/.github/workflows/python-ci.yml@e98676e99b75371460286cebe55895d0ec7631c8  # v0.0.1
    with:
      python-version: "3.14"
      cov-package: "robotsix_board"
      coverage-threshold: "70"
      run-bandit: true
      install-extras: "dev"
    permissions:
      contents: read
      security-events: write

  security:
    uses: damien-robotsix/robotsix-mill/.github/workflows/python-security.yml@e98676e99b75371460286cebe55895d0ec7631c8  # v0.0.1
    with:
      python-version: "3.14"
      install-extras: "dev"
      run-trufflehog: true
      run-pip-audit: true
    permissions:
      contents: read
      actions: write

  python-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool:
          - detect-secrets
          - vulture
          - mypy-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen --extra dev
      - run: |
          case "${{ matrix.tool }}" in
            detect-secrets) uv run detect-secrets scan --baseline .secrets.baseline ;;
            vulture) uv run vulture src/ vulture_whitelist.py ;;
            mypy-tests) uv run mypy tests ;;
          esac

  js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        tool: [lint, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --package-lock-only && npm ci
      - run: |
          case "${{ matrix.tool }}" in
            lint)
              npm audit --audit-level=high
              npx eslint --max-warnings 0 src/robotsix_board/static/board.js
              npx stylelint src/robotsix_board/static/board.css
              npx markdownlint-cli2 '**/*.md' '#node_modules' '#.venv' '#changes'
              ;;
            test)
              npx vitest run --coverage
              ;;
          esac

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3.0.3
        id: changes
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
      - if: steps.changes.outputs.workflows == 'true'
        run: docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:1.7.7 -color

  build-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
      - name: Build wheel
        run: uv build
      - name: Smoke test — import from built wheel
        run: uv run --with dist/*.whl --no-project -- python -c "import robotsix_board; print(robotsix_board.__version__)"
