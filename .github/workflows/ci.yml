name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --extra dev
      - run: uv run pytest

  trufflehog:
    name: Trufflehog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install trufflehog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      - name: Run trufflehog
        run: trufflehog git file://. --fail --results=verified,unknown

  uv-audit:
    name: UV Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv audit

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool:
          - detect-secrets
          - vulture
          - mypy-tests
          - deptry
          - bandit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --extra dev
      - run: |
          case "$TOOL" in
            detect-secrets) uv run detect-secrets scan --baseline .secrets.baseline ;;
            vulture) uv run vulture src/ vulture_whitelist.py ;;
            mypy-tests) uv run mypy tests ;;
            deptry) uv run deptry . ;;
            bandit) uv run bandit -r src/ ;;
          esac
        env:
          TOOL: ${{ matrix.tool }}

  js:
    name: JS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        tool: [lint, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --package-lock-only && npm ci
      - run: |
          case "$TOOL" in
            lint)
              npm audit --audit-level=high
              npx eslint --max-warnings 0 src/robotsix_board/static/board.js
              npx stylelint src/robotsix_board/static/board.css
              npx markdownlint-cli2 '**/*.md' '#node_modules' '#.venv' '#changelog.d'
              npx tsc --noEmit
              ;;
            test)
              npx vitest run --coverage
              ;;
          esac
        env:
          TOOL: ${{ matrix.tool }}

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: changes
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
      - if: steps.changes.outputs.workflows == 'true'
        run: |
          set -euo pipefail
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz
          ./actionlint -color

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: uv python install 3.14
      - run: uv sync --locked --extra dev
      - run: npm ci
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz
          sudo mv actionlint /usr/local/bin/
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  build-smoke:
    name: Build smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Build wheel
        run: uv build
      - name: Smoke test — import from built wheel
        run: uv run --with dist/*.whl --no-project -- python -c "import robotsix_board; print(robotsix_board.__version__)"
