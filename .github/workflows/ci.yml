name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@5cd8c1facb02299da618979e7a55f1953f9c075a  # v0.0.1
    with:
      python-version: "3.14"
      cov-package: "robotsix_board"
      coverage-threshold: "80"
      run-bandit: true
      install-extras: "dev"
    permissions:
      contents: read
      security-events: write  # required for CodeQL SARIF uploads

  security:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@5cd8c1facb02299da618979e7a55f1953f9c075a  # v0.0.1
    with:
      python-version: "3.14"
      install-extras: "dev"
      run-trufflehog: true
    permissions:
      contents: read
      actions: write  # required for GHAS code scanning integration

  uv-audit:
    name: uv audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - run: uv audit --frozen

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    env:
      UV_MALWARE_CHECK: "1"
    strategy:
      matrix:
        tool:
          - detect-secrets
          - vulture
          - mypy-tests
          - deptry
          - modules
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --extra dev
      - run: |
          case "$TOOL" in
            detect-secrets) uv run detect-secrets scan --baseline .secrets.baseline ;;
            vulture) uv run vulture src/ vulture_whitelist.py ;;
            mypy-tests) uv run mypy src tests ;;
            deptry) uv run deptry . ;;
            modules) uv run robotsix-modules validate docs/modules.yaml ;;
          esac
        env:
          TOOL: ${{ matrix.tool }}

  js:
    name: JS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        tool: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: |
          case "$TOOL" in
            lint)
              npm run audit
              npm run lint:js
              npm run lint:css  # stylelint
              npm run lint:md
              npm run typecheck
              ;;
            test)
              npm run test:js
              ;;
          esac
        env:
          TOOL: ${{ matrix.tool }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    env:
      UV_MALWARE_CHECK: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: uv python install 3.14
      - run: uv sync --locked --extra dev
      - run: npm ci
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  build-smoke:
    name: Build smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Build wheel
        run: uv build
      - name: Smoke test — import from built wheel
        run: uv run --with dist/*.whl --no-project -- python -c "import robotsix_board; print(robotsix_board.__version__)"
