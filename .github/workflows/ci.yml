name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@5cd8c1facb02299da618979e7a55f1953f9c075a  # v0.0.1
    with:
      python-version: "3.14"
      cov-package: "robotsix_board"
      coverage-threshold: "80"
      run-bandit: true
      install-extras: "dev"
    permissions:
      contents: read
      security-events: write  # required for CodeQL SARIF uploads

  security:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@5cd8c1facb02299da618979e7a55f1953f9c075a  # v0.0.1
    with:
      python-version: "3.14"
      install-extras: "dev"
      run-trufflehog: true
      run-pip-audit: true
    permissions:
      contents: read
      actions: write  # required for GHAS code scanning integration

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool:
          - detect-secrets
          - vulture
          - mypy-tests
          - deptry
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --extra dev
      - run: |
          case "$TOOL" in
            detect-secrets) uv run detect-secrets scan --baseline .secrets.baseline ;;
            vulture) uv run vulture src/ vulture_whitelist.py ;;
            mypy-tests) uv run mypy tests ;;
            deptry) uv run deptry . ;;
          esac
        env:
          TOOL: ${{ matrix.tool }}

  js:
    name: JS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        tool: [lint, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --package-lock-only && npm ci
      - run: |
          case "$TOOL" in
            lint)
              npm run audit
              npm run lint:js
              npm run lint:css  # stylelint
              npm run lint:md
              npm run typecheck
              ;;
            test)
              npm run test:js
              ;;
          esac
        env:
          TOOL: ${{ matrix.tool }}

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: uv python install 3.14
      - run: uv sync --locked --extra dev
      - run: npm ci
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  build-smoke:
    name: Build smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Build wheel
        run: uv build
      - name: Smoke test — import from built wheel
        run: uv run --with dist/*.whl --no-project -- python -c "import robotsix_board; print(robotsix_board.__version__)"
