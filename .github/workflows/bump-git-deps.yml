name: Bump git-pinned deps

permissions: {}

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump-robotsix-modules:
    name: Bump robotsix-modules
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push the bump branch
      pull-requests: write  # Needed to create the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Check robotsix-modules pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="robotsix-modules"
          URL="https://github.com/damien-robotsix/robotsix-modules.git"
          LINE=$(grep "^$PKG = { git = \"$URL\", rev = \"" pyproject.toml)
          CUR=$(printf '%s\n' "$LINE" | sed -E 's/.*rev = "([0-9a-f]{40})".*/\1/')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          LATEST=$(gh api repos/damien-robotsix/robotsix-modules/git/ref/heads/main --jq '.object.sha')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Create bump PR if outdated
        if: steps.check.outputs.current != steps.check.outputs.latest
        env:
          CUR: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="bump/robotsix-modules-${LATEST:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          sed -i "s/$CUR/$LATEST/" pyproject.toml
          uv lock
          git add pyproject.toml uv.lock
          git commit -m "chore: bump robotsix-modules pin to ${LATEST:0:12}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "chore: bump robotsix-modules git pin to ${LATEST:0:12}" \
            --body "Automated bump of the git-pinned robotsix-modules dependency from ${CUR:0:12} to ${LATEST:0:12}." \
            --label dependencies

  bump-robotsix-ui-base:
    name: Bump robotsix-ui-base CSS
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push the bump branch
      pull-requests: write  # Needed to create the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check robotsix-ui pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CSS_FILE="src/robotsix_board/static/robotsix-ui-base.css"
          CUR=$(sed -n '5s/.*Pinned at: \([0-9a-f]\{40\}\).*/\1/p' "$CSS_FILE")
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          # Track the latest v0.1.* tag rather than main HEAD (fleet rollout):
          # the v0.1.x line is the stable series; main may contain unreleased
          # changes.  The workflow auto-bumps within v0.1.x only.
          LATEST_TAG=$(gh api repos/damien-robotsix/robotsix-ui/git/refs/tags \
            --jq '.[].ref' | grep 'refs/tags/v0\.1\.' | sort -V | tail -1)
          VERSION="${LATEST_TAG#refs/tags/}"
          # refs/tags gives the TAG OBJECT sha for annotated tags (which
          # release-please now creates) — raw.githubusercontent 404s on it.
          # commits/{tag} always dereferences to the commit sha.
          LATEST_SHA=$(gh api "repos/damien-robotsix/robotsix-ui/commits/${VERSION}" --jq .sha)
          echo "latest=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create bump PR if outdated
        if: steps.check.outputs.current != steps.check.outputs.latest
        env:
          CUR: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CSS_FILE: src/robotsix_board/static/robotsix-ui-base.css
          VANILLA_FILE: src/robotsix_board/static/vanilla.js
        run: |
          BRANCH="bump/robotsix-ui-base-${LATEST:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Fetch both release assets (style.css + vanilla.js) for the version
          # tag in ONE call via the robotsix-ui fetch_assets CLI — the
          # designated asset pipeline (robotsix-central-deploy consumes the
          # same release assets).  The CLI is stdlib-only Python, no npm.
          python3 -m venv /tmp/robotsix-ui-venv
          /tmp/robotsix-ui-venv/bin/pip install --quiet \
            "robotsix-ui @ git+https://github.com/damien-robotsix/robotsix-ui.git@${LATEST}"
          UI_ASSETS="$(mktemp -d)"
          /tmp/robotsix-ui-venv/bin/python -m robotsix_ui fetch \
            --version "$VERSION" --dest "$UI_ASSETS"

          # Write the updated stylesheet: the release style.css asset with the
          # provenance header.  Keep the "Pinned at:" line shape — the
          # 'Check robotsix-ui pin' step above parses it from line 5.
          cat > "$CSS_FILE" <<EOF
          /*
           * robotsix-ui shared base stylesheet — vendored into robotsix-board.
           *
           * Source: https://github.com/damien-robotsix/robotsix-ui
           * Pinned at: $LATEST ($VERSION)
           *
           * This file is the robotsix-ui release style.css asset — the compiled
           * combination of tokens.css + base.css + components.css + utilities.css —
           * fetched via the robotsix-ui fetch_assets pipeline (python -m robotsix_ui
           * fetch --version <tag> --dest <dir>).  It is committed so that Python-only
           * consumers of robotsix-board do not need Node.js / npm to get the shared
           * base.
           *
           * To update: run the robotsix-ui fetch_assets CLI for the pinned v0.1.x tag
           * and replace this file with the fetched style.css, keeping this header;
           * vanilla.js is fetched by the same call.  See README "Consuming
           * robotsix-ui styles"; the weekly bump-git-deps workflow automates this.
           */
          EOF
          cat "$UI_ASSETS/style.css" >> "$CSS_FILE"

          # vanilla.js is fetched by the same fetch_assets call above.
          cp "$UI_ASSETS/vanilla.js" "$VANILLA_FILE"

          git add "$CSS_FILE"
          FILES_CHANGED="robotsix-ui-base.css and vanilla.js"
          git add "$VANILLA_FILE"
          git commit -m "chore: re-vendor robotsix-ui @ ${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "chore: re-vendor robotsix-ui @ ${VERSION}" \
            --body "Automated re-vendor of ${FILES_CHANGED} from ${CUR:0:12} to ${LATEST:0:12} (${VERSION})." \
            --label dependencies
