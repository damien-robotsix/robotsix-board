name: Bump git-pinned deps

permissions: {}

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump-robotsix-modules:
    name: Bump robotsix-modules
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push the bump branch
      pull-requests: write  # Needed to create the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Check robotsix-modules pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="robotsix-modules"
          URL="https://github.com/damien-robotsix/robotsix-modules.git"
          LINE=$(grep "$PKG @ git+$URL@" pyproject.toml)
          CUR="${LINE##*@}"
          CUR="${CUR:0:40}"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          LATEST=$(gh api repos/damien-robotsix/robotsix-modules/git/ref/heads/main --jq '.object.sha')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Create bump PR if outdated
        if: steps.check.outputs.current != steps.check.outputs.latest
        env:
          CUR: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="bump/robotsix-modules-${LATEST:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          sed -i "s/$CUR/$LATEST/" pyproject.toml
          uv lock
          git add pyproject.toml uv.lock
          git commit -m "chore: bump robotsix-modules pin to ${LATEST:0:12}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "chore: bump robotsix-modules git pin to ${LATEST:0:12}" \
            --body "Automated bump of the git-pinned robotsix-modules dependency from ${CUR:0:12} to ${LATEST:0:12}." \
            --label dependencies

  bump-robotsix-ui-base:
    name: Bump robotsix-ui-base CSS
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push the bump branch
      pull-requests: write  # Needed to create the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check robotsix-ui pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CSS_FILE="src/robotsix_board/static/robotsix-ui-base.css"
          CUR=$(sed -n '5s/.*Pinned at: \([0-9a-f]\{40\}\).*/\1/p' "$CSS_FILE")
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          # Track the latest v0.1.* tag rather than main HEAD (fleet rollout):
          # the v0.1.x line is the stable series; main may contain unreleased
          # changes.  The workflow auto-bumps within v0.1.x only.
          LATEST_TAG=$(gh api repos/damien-robotsix/robotsix-ui/git/refs/tags \
            --jq '.[].ref' | grep 'refs/tags/v0\.1\.' | sort -V | tail -1)
          VERSION="${LATEST_TAG#refs/tags/}"
          LATEST_SHA=$(gh api "repos/damien-robotsix/robotsix-ui/git/refs/tags/${VERSION}" --jq .object.sha)
          echo "latest=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create bump PR if outdated
        if: steps.check.outputs.current != steps.check.outputs.latest
        env:
          CUR: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CSS_FILE: src/robotsix_board/static/robotsix-ui-base.css
          VANILLA_FILE: src/robotsix_board/static/vanilla.js
        run: |
          BRANCH="bump/robotsix-ui-base-${LATEST:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Fetch upstream CSS files at the new SHA
          BASE_URL="https://raw.githubusercontent.com/damien-robotsix/robotsix-ui/${LATEST}/src/styles"
          TOKENS=$(curl -sSf "$BASE_URL/tokens.css")
          BASE=$(curl -sSf "$BASE_URL/base.css")
          COMPONENTS=$(curl -sSf "$BASE_URL/components.css")
          UTILITIES=$(curl -sSf "$BASE_URL/utilities.css")

          # Write updated vendored CSS file
          {
            printf '/*\n'
            printf ' * robotsix-ui shared base stylesheet — vendored into robotsix-board.\n'
            printf ' *\n'
            printf ' * Source: https://github.com/damien-robotsix/robotsix-ui\n'
            printf ' * Pinned at: %s (%s)\n' "$LATEST" "$VERSION"
            printf ' *\n'
            printf ' * This file concatenates tokens.css + base.css + components.css +\n'
            printf " * utilities.css from robotsix-ui's src/styles/.  It is committed so that\n"
            printf ' * Python-only consumers of robotsix-board do not need Node.js / npm to get the\n'
            printf ' * shared base.\n'
            printf ' *\n'
            printf " * To update: pull the latest CSS from robotsix-ui's src/styles/ at\n"
            printf ' * the desired commit SHA and replace this file.\n'
            printf ' */\n'
            printf '\n'
            printf '%s\n' "$TOKENS"
            printf '\n'
            printf '%s\n' "$BASE"
            printf '\n'
            printf '%s\n' "$COMPONENTS"
            printf '\n'
            printf '%s\n' "$UTILITIES"
          } > "$CSS_FILE"

          # Fetch and write the framework-free vanilla.js from the GitHub release
          curl -sSfL \
            "https://github.com/damien-robotsix/robotsix-ui/releases/download/${VERSION}/vanilla.js" \
            -o "$VANILLA_FILE"

          git add "$CSS_FILE" "$VANILLA_FILE"
          git commit -m "chore: re-vendor robotsix-ui @ ${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "chore: re-vendor robotsix-ui @ ${VERSION}" \
            --body "Automated re-vendor of robotsix-ui-base.css and vanilla.js from ${CUR:0:12} to ${LATEST:0:12} (${VERSION})." \
            --label dependencies
