name: Baseline check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/baseline-check.yml@188518bece972d7d5f1c4e2a0f2226d2526dc0fa  # main
    with:
      has-board: true
      python-version: "3.14"
