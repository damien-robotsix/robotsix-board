name: Dependency Review
on:
  # zizmor: ignore[dangerous-triggers] — pull_request_target is the required
  # trigger for dependency-review-action to compare against the base branch.
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Disabled: Dependency graph is not enabled on this private repository.
    # The dependency-review-action requires the Dependency graph API which
    # is unavailable here, causing "Dependency review is not supported on
    # this repository" failures on every PR.
    if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019  # v4.5.0
