repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: check-json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npx eslint
        language: system
        types: [javascript]
        stages: [pre-commit]
      - id: stylelint
        name: stylelint
        entry: npx stylelint
        language: system
        types: [css]
        stages: [pre-commit]
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit
        args: [-ll]
  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: vulture src/ vulture_whitelist.py
        language: system
        types: [python]
        pass_filenames: false
      - id: robotsix-modules-validate
        name: robotsix-modules-validate
        entry: uv run robotsix-modules validate docs/modules.yaml
        language: system
        pass_filenames: false
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: '^\.secrets\.baseline$'
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
